[platformio]
default_envs = olimex-esp32-poe-iso

[env:olimex-esp32-poe-iso]
platform = espressif32 @ 6.12.0
board = esp32-poe-iso
board_build.partitions = min_spiffs.csv
framework = arduino
lib_deps =
    https://github.com/James-NZ/BLESerial.git#32fea85c10abba28455fdecc751724521b48dbce
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<led_mapping.cpp>
    +<live_log.cpp>
    +<moonboard_protocol.cpp>
    +<route_timeout.cpp>
    +<runtime_settings.cpp>
    +<wled_payload.cpp>
